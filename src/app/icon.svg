<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" fill="none">
  <!-- Warm e-paper tile for crisp contrast on light and dark browser tabs -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="#f3f1ec" stroke="#151515" stroke-width="2.5"/>

  <!-- Sealed computer ring (bowl of lowercase 'd' for deRoute) -->
  <circle cx="31" cy="35" r="14.2" stroke="#151515" stroke-width="4.4"/>

  <!-- Ascender & stem of lowercase 'd' -->
  <line x1="45.2" y1="11" x2="45.2" y2="49.2" stroke="#151515" stroke-width="4.4" stroke-linecap="round"/>

  <!-- Precision paper-knockout collar around the ingress line so it pierces the ring cleanly -->
  <line x1="8" y1="35" x2="23.5" y2="35" stroke="#f3f1ec" stroke-width="8.5" stroke-linecap="butt"/>

  <!-- Short locked route trace entering the sealed bowl -->
  <line x1="9.5" y1="35" x2="22.5" y2="35" stroke="#151515" stroke-width="3.6" stroke-linecap="round"/>

  <!-- Single orange element: the private question safely inside the sealed ring -->
  <circle cx="31" cy="35" r="5.6" fill="#d9531e"/>
</svg>
