name: Build and Push deroute-core Enclave Image

on:
  push:
    branches:
      - main
    paths:
      - "core/**"
      - ".github/workflows/core-image.yml"
  workflow_dispatch:

concurrency:
  group: deroute-core-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Push ghcr.io/thepigdestroyer/deroute-core
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22 and run deroute-core tests
        run: |
          cd core
          npm ci --ignore-scripts
          npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/thepigdestroyer/deroute-core
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          context: ./core
          file: ./core/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Report pushed image digest in job summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/thepigdestroyer/deroute-core
        run: |
          printf '### deroute-core Enclave Image Published\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Pinned image reference for Google Cloud Confidential Space (`scripts/gcp/deploy-core.sh`):\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '```bash\nIMAGE_DIGEST=%s\ntee-image-reference=%s@%s\n```\n\n' "$DIGEST" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf 'Pinned image reference for `tinfoil-config.yml`:\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '```yaml\nimage: "%s@%s"\n```\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf 'Image: %s@%s\n' "$IMAGE" "$DIGEST"
